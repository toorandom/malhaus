# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Match MALHAUS_MAX_UPLOAD_MB + some headroom for multipart overhead
    client_max_body_size 105m;

    # Long timeout — analysis can take several minutes
    proxy_read_timeout  1800;
    proxy_send_timeout  1800;

    # MCP server — Streamable HTTP transport
    # Clients connect to https://your-domain.com/mcp (port 443, TLS handled here)
    location /mcp {
        proxy_pass         http://malhaus:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Streamable HTTP / SSE — disable buffering so events
        # reach the client immediately instead of being held in nginx's buffer
        proxy_buffering    off;
        proxy_cache        off;

        # Keep the connection alive for long-running analysis polls
        proxy_read_timeout  1800;
        proxy_send_timeout  1800;
    }

    location / {
        proxy_pass         http://malhaus:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
