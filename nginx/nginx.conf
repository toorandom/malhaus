# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Certificate paths — mount your certs into the container at these paths.
    #
    # Let's Encrypt (default docker-compose.yml mounts /etc/letsencrypt):
    #   ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;
    #
    # Self-signed / internal CA (mount ./certs:/etc/nginx/certs:ro):
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    # Set the correct paths for your deployment below:
    ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Match MALHAUS_MAX_UPLOAD_MB + some headroom for multipart overhead
    client_max_body_size 105m;

    # Long timeout — analysis can take several minutes
    proxy_read_timeout  1800;
    proxy_send_timeout  1800;

    # MCP server (Streamable HTTP) — proxied from /mcp to internal port 8001
    # Clients connect to https://your-domain/mcp — port 8001 is never exposed externally
    location /mcp {
        proxy_pass         http://malhaus:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering — required for Streamable HTTP / SSE streaming
        proxy_buffering    off;
        proxy_cache        off;

        proxy_read_timeout  1800;
        proxy_send_timeout  1800;
    }

    location / {
        proxy_pass         http://malhaus:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
