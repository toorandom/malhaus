<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · malhaus admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .pw-card {
      max-width: 440px;
      margin: 60px auto 0;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .pw-card h1 { margin: 0 0 6px 0; font-size: 20px; }
    .pw-card .sub { margin: 0 0 24px 0; font-size: 13px; color: var(--muted); }
    .field { margin-bottom: 16px; }
    .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
    .field input { width:100%; background:var(--panel2); border:1px solid rgba(255,255,255,.15); color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; outline:none; }
    .field input:focus { border-color:rgba(255,255,255,.35); }
    .submit-btn { width:100%; margin-top:8px; padding:12px; font-size:14px; font-weight:700; background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.18); border-radius:10px; cursor:pointer; }
    .submit-btn:hover { background:rgba(255,255,255,.12); }
    .alerts { margin-bottom: 20px; }
    .alert { padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.12); margin-bottom:8px; font-size:13px; background:rgba(255,255,255,.03); }
    .alert.error   { border-color:rgba(255,77,77,.4);   background:rgba(255,77,77,.09); }
    .alert.success { border-color:rgba(42,214,124,.35); background:rgba(42,214,124,.08); }
    .back-link { display:inline-block; margin-bottom:20px; font-size:13px; color:var(--muted); text-decoration:none; }
    .back-link:hover { color:var(--text); }
  </style>
</head>
<body class="bg">
  <div class="wrap">
    <div class="pw-card">
      <a class="back-link" href="{{ url_for('admin_bp.keys') }}">← Back to keys</a>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="alerts">
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <h1>Change password</h1>
      <div class="sub">Logged in as <span class="mono">{{ username }}</span></div>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="current_password">Current password</label>
          <input id="current_password" type="password" name="current_password" required autocomplete="current-password">
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" type="password" name="new_password" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password">
        </div>
        <button class="submit-btn" type="submit">Update password</button>
      </form>
    </div>
  </div>
</body>
</html>
